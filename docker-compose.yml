services:
  postgres:
    image: postgres:16-alpine
    container_name: festa-fantasia-postgres
    environment:
      POSTGRES_DB: festa_fantasia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
